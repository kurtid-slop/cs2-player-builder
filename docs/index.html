<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CS2 Player Builder</title>
<meta name="description" content="Spin a random CS2 team, pick a player, and take one of their attributes. Seven rounds, one respin.">
<style>
  :root {
    --bg: #0d1015;
    --panel: #151a21;
    --panel-2: #1c222b;
    --line: #2a313c;
    --text: #e8ecf1;
    --muted: #8b95a3;
    --accent: #f5a524;
    --accent-ink: #1a1204;
    --danger: #e5484d;

    --tier-low: #e5484d;
    --tier-ok: #f08c3a;
    --tier-good: #e8c547;
    --tier-great: #46c07b;
    --tier-elite: #3fb6e8;
    --tier-s: #b57bff;

    --radius: 10px;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }

  button {
    font: inherit;
    color: inherit;
    cursor: pointer;
  }

  button:disabled { cursor: not-allowed; }

  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  /* ---------- header ---------- */

  header { margin-bottom: 20px; }

  h1 {
    margin: 0;
    font-size: clamp(1.6rem, 4vw, 2.2rem);
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }

  h1 span { color: var(--accent); }

  .tagline {
    margin: 4px 0 0;
    color: var(--muted);
  }

  /* ---------- layout ---------- */

  .layout {
    display: grid;
    grid-template-columns: minmax(0, 340px) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); }

    /* Compact two-column build card on narrow screens */
    .slots { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .slot { padding: 8px 10px; }
  }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
  }

  h2 {
    margin: 0 0 12px;
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  /* ---------- build card ---------- */

  .slots {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 8px;
  }

  .slot {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
  }

  .slot.empty { border-style: dashed; }

  .slot-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
  }

  .slot-name { font-weight: 600; }

  .slot-value {
    font-family: var(--mono);
    font-weight: 700;
  }

  .slot-source {
    margin-top: 2px;
    font-size: 0.8rem;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar {
    height: 4px;
    margin-top: 8px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    border-radius: 2px;
  }

  .available {
    margin: 14px 0 0;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .available b { color: var(--text); font-weight: 600; }

  /* ---------- tiers ---------- */

  .t-low   { color: var(--tier-low); }
  .t-ok    { color: var(--tier-ok); }
  .t-good  { color: var(--tier-good); }
  .t-great { color: var(--tier-great); }
  .t-elite { color: var(--tier-elite); }

  /* S tier (95+) glows purple */
  .t-s {
    color: var(--tier-s);
    text-shadow: 0 0 8px rgba(181, 123, 255, 0.7);
    animation: shine 1.8s ease-in-out infinite;
  }

  @keyframes shine {
    50% { text-shadow: 0 0 14px rgba(181, 123, 255, 1); }
  }

  .b-low   { background: var(--tier-low); }
  .b-ok    { background: var(--tier-ok); }
  .b-good  { background: var(--tier-good); }
  .b-great { background: var(--tier-great); }
  .b-elite { background: var(--tier-elite); }
  .b-s     { background: linear-gradient(90deg, #8a4dff, var(--tier-s)); box-shadow: 0 0 8px rgba(181, 123, 255, 0.6); }

  /* ---------- spin area ---------- */

  .status {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }

  .round {
    font-size: 0.8rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .round b { color: var(--text); }

  .status-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .sound-btn {
    border: 1px solid var(--line);
    background: transparent;
    border-radius: 999px;
    padding: 3px 10px;
    font-size: 0.75rem;
    color: var(--muted);
  }

  .sound-btn:hover { color: var(--text); border-color: var(--muted); }

  .team-display {
    text-align: center;
    padding: 10px 12px 16px;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 14px;
  }

  /* Slot machine reel: shows the centre item plus a glimpse of
     the items above and below */
  .reel {
    --item: 1.35em;
    position: relative;
    height: calc(var(--item) * 2.4);
    overflow: hidden;
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    font-weight: 800;
    letter-spacing: 0.01em;
    -webkit-mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
    mask-image: linear-gradient(transparent, #000 30%, #000 70%, transparent);
  }

  /* Pointers marking the winning line */
  .reel::before,
  .reel::after {
    content: "";
    position: absolute;
    top: 50%;
    z-index: 1;
    border: 0.3em solid transparent;
    transform: translateY(-50%);
  }

  .reel::before { left: 0; border-left-color: var(--accent); }
  .reel::after { right: 0; border-right-color: var(--accent); }

  /* Centre row sits 0.7 items down in a 2.4-item window */
  .reel-strip {
    transform: translateY(calc(var(--item) * 0.7));
    will-change: transform;
  }

  .reel-item {
    height: var(--item);
    line-height: var(--item);
    padding: 0 0.8em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .reel.spinning .reel-item { color: var(--muted); }

  .reel.spinning .reel-strip { filter: blur(0.6px); }

  .team-display.landed { animation: land 0.6s ease-out; }

  @keyframes land {
    0%   { border-color: var(--accent); box-shadow: 0 0 0 0 rgba(245, 165, 36, 0.55); transform: scale(1.03); }
    100% { border-color: var(--line); box-shadow: 0 0 0 14px rgba(245, 165, 36, 0); transform: scale(1); }
  }

  .team-meta {
    margin-top: 4px;
    min-height: 1.3em;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .btn {
    border: 1px solid var(--line);
    background: var(--panel-2);
    border-radius: 8px;
    padding: 10px 18px;
    font-weight: 600;
  }

  .btn:hover:not(:disabled) { border-color: var(--muted); }

  .btn:disabled { opacity: 0.4; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }

  .btn-quiet {
    margin-left: auto;
    background: transparent;
    color: var(--muted);
  }

  .btn-quiet.confirm {
    border-color: var(--danger);
    color: var(--danger);
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .btn-primary:hover:not(:disabled) { filter: brightness(1.08); border-color: var(--accent); }

  .hint {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 1.4em;
  }

  /* ---------- roster ---------- */

  .roster {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 10px;
    margin-top: 14px;
    align-items: start;
  }

  .player {
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    overflow: hidden;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
  }

  .player:hover {
    transform: translateY(-4px);
    border-color: var(--muted);
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
  }

  .player.selected,
  .player.selected:hover {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 10px 24px rgba(0, 0, 0, 0.45);
  }

  .player:hover .player-name,
  .player.selected .player-name { color: var(--accent); }

  .player-name { transition: color 0.18s ease; }

  .player .mini b { transition: transform 0.18s ease; }

  .player:hover .mini:not(.taken) b { transform: scale(1.15); }

  /* Cards deal in one after another when a team lands */
  .roster.enter .player {
    animation: deal 0.35s ease-out backwards;
    animation-delay: calc(var(--i) * 60ms);
  }

  @keyframes deal {
    from { opacity: 0; transform: translateY(12px); }
  }

  .player { cursor: pointer; }

  .player-head {
    cursor: pointer;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    padding: 12px 12px 8px;
    border: 0;
    background: transparent;
    text-align: left;
  }

  .player-name { font-weight: 700; font-size: 1.05rem; }

  .player-age { color: var(--muted); font-size: 0.8rem; }

  .player-stats {
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    gap: 2px;
    padding: 0 8px 12px;
    text-align: center;
  }

  .mini { font-size: 0.65rem; color: var(--muted); }

  .mini b {
    display: block;
    font-family: var(--mono);
    font-size: 0.9rem;
  }

  .mini.taken { opacity: 0.3; }

  .pick {
    border-top: 1px solid var(--line);
    padding: 10px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
    gap: 6px;
  }

  .pick-label {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
    color: var(--muted);
  }

  .pick { cursor: default; }

  /* Once a player is locked in, the rest of the roster fades out */
  .roster.locked .player:not(.selected) {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .roster.locked .player:not(.selected):hover {
    transform: none;
    box-shadow: none;
    border-color: var(--line);
  }

  .roster.locked .player:not(.selected):hover .player-name { color: inherit; }

  .roster.locked .player:not(.selected):hover .mini b { transform: none; }

  .roster.locked .player.selected,
  .roster.locked .player-head { cursor: default; }

  .pick-btn {
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-size: 0.85rem;
  }

  .pick-btn { transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease; }

  .pick-btn:hover {
    border-color: var(--accent);
    background: var(--panel-2);
    transform: translateY(-2px);
  }

  .pick-btn b { font-family: var(--mono); }

  /* ---------- result ---------- */

  .result { text-align: center; }

  .grade {
    font-size: 4rem;
    font-weight: 800;
    line-height: 1;
    margin: 6px 0;
  }

  .result-overall {
    font-family: var(--mono);
    font-size: 1.4rem;
    font-weight: 700;
  }

  .result-lines {
    margin: 14px auto 18px;
    max-width: 520px;
    color: var(--muted);
  }

  .result-lines p { margin: 4px 0; }

  .result-lines b { color: var(--text); }

  .player-link {
    color: var(--accent);
    font-weight: 700;
    text-decoration: underline;
    text-underline-offset: 3px;
  }

  .player-link:hover { filter: brightness(1.15); }

  .player-link::after {
    content: " ↗";
    font-size: 0.8em;
  }

  .result .controls { justify-content: center; }

  /* ---------- leaderboard ---------- */

  .board { margin-top: 20px; }

  .board-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 4px;
  }

  .board-row {
    display: grid;
    grid-template-columns: 2.2em minmax(0, 1fr) 2em 3.4em;
    align-items: baseline;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--panel-2);
    font-variant-numeric: tabular-nums;
  }

  .board-row.mine {
    outline: 1px solid var(--accent);
    background: rgba(245, 165, 36, 0.08);
  }

  .board-rank { color: var(--muted); font-family: var(--mono); }

  .board-name {
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .board-grade { font-weight: 800; text-align: center; }

  .board-score { font-family: var(--mono); text-align: right; }

  .board-empty,
  .board-status {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .board-status.error { color: var(--danger); }

  .submit {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin: 0 0 16px;
  }

  .submit input {
    flex: 1 1 180px;
    max-width: 260px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text);
    font: inherit;
  }

  .submit input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  footer {
    margin-top: 28px;
    color: var(--muted);
    font-size: 0.8rem;
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>CS2 <span>Player Builder</span></h1>
    <p class="tagline">
      Spin a random team, pick one of its players and take one of their attributes.
      Seven rounds, seven attributes, one respin.
    </p>
  </header>

  <main class="layout">

    <section class="panel" aria-labelledby="build-title">
      <h2 id="build-title">Your player</h2>
      <ul class="slots" id="slots"></ul>
      <p class="available" id="available" hidden></p>
    </section>

    <div>
      <section class="panel" id="play" aria-labelledby="round-title">
        <div class="status">
          <div class="round" id="round-title">Round <b id="round">1</b> / 7</div>
          <div class="status-right">
            <div class="round" id="respins-left"></div>
            <button class="sound-btn" id="sound" aria-pressed="true">Sound on</button>
          </div>
        </div>

        <div class="team-display" aria-live="polite">
          <div class="reel" id="reel">
            <div class="reel-strip" id="reel-strip"></div>
          </div>
          <div class="team-meta" id="team-meta"></div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="spin">Spin team</button>
          <button class="btn" id="respin">Respin</button>
          <button class="btn btn-quiet" id="restart">Restart</button>
        </div>

        <p class="hint" id="hint"></p>

        <div class="roster" id="roster"></div>
      </section>

      <section class="panel result" id="result" hidden aria-live="polite">
        <h2>Final build</h2>
        <div class="grade" id="grade"></div>
        <div class="result-overall" id="result-overall"></div>
        <div class="result-lines" id="result-lines"></div>
        <form class="submit" id="submit" hidden>
          <label class="sr-only" for="player-name">Your name</label>
          <input id="player-name" name="player-name" maxlength="20" autocomplete="nickname"
                 placeholder="Your name" required>
          <button class="btn btn-primary" id="submit-btn" type="submit">Submit score</button>
        </form>
        <p class="board-status" id="submit-status" hidden></p>
        <div class="controls">
          <button class="btn btn-primary" id="again">Play again</button>
          <button class="btn" id="copy">Copy result</button>
        </div>
      </section>

      <section class="panel board" id="board" hidden aria-labelledby="board-title">
        <h2 id="board-title">Leaderboard</h2>
        <ol class="board-list" id="board-list"></ol>
        <p class="board-empty" id="board-empty" hidden></p>
      </section>
    </div>

  </main>

  <footer id="footer" hidden></footer>
</div>

<script src="players.js"></script>
<script src="leaderboard-config.js"></script>
<script>
(function () {

  // ==========================================================
  // SETUP
  // ==========================================================

  const DATA = window.GAME_DATA;
  const ATTRS = DATA.attributes;
  const ROUNDS = ATTRS.length;
  const RESPINS = 1;
  const REEL_AFTER = 3;    // teams left below the rolled one when it stops

  // Reel timing from sounds/spin.json: the reel starts at the
  // flick and each tick in the sound moves the next team onto
  // the centre line, so the rolled team lands on the last tick.
  // Used until spin.json loads, or if it can't be loaded.
  let SPIN_TIMING = fallbackTiming(30, 0.3, 5.5);

  function fallbackTiming(ticks, flick, end) {
    const times = [];
    for (let k = 1; k <= ticks; k++) {
      // Ease out: ticks spread further apart as the reel slows
      times.push(flick + (end - flick) * (1 - Math.sqrt(1 - k / ticks)));
    }
    return { flick, ticks: times };
  }

  fetch("sounds/spin.json")
    .then(response => response.json())
    .then(data => {
      if (Array.isArray(data.tick_times_s) && data.tick_times_s.length) {
        SPIN_TIMING = { flick: data.flick_strike_s || 0, ticks: data.tick_times_s };
      }
    })
    .catch(() => { /* keep the fallback timing */ });

  // How many teams have crossed the centre line t seconds after
  // the sound starts: still until the flick, then one team per
  // tick, moving at a steady speed between ticks.
  function reelPosition(t, timing) {
    const points = [[0, 0], [timing.flick, 0], ...timing.ticks.map((tick, i) => [tick, i + 1])];
    if (t >= points[points.length - 1][0]) return timing.ticks.length;
    for (let i = 1; i < points.length; i++) {
      const [t1, p1] = points[i];
      if (t < t1) {
        const [t0, p0] = points[i - 1];
        return t1 === t0 ? p1 : p0 + (p1 - p0) * (t - t0) / (t1 - t0);
      }
    }
    return timing.ticks.length;
  }
  const BEST_KEY = "cs2-player-builder-best";
  const SOUND_KEY = "cs2-player-builder-sound";

  // Case opening sound, 0:01-0:07 of the original clip
  const spinSound = new Audio("sounds/spin.m4a");
  spinSound.preload = "auto";

  // Add ?debug to the URL to show data details: the footer,
  // the available attributes line and each team's cluster
  const DEBUG = new URLSearchParams(location.search).has("debug");

  const ALL_PLAYERS = DATA.teams.flatMap(team =>
    team.players.map(player => ({ ...player, team: team.name }))
  );

  const $ = id => document.getElementById(id);

  const reduceMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  let state;

  // Small DOM helper: h("div", {class: "x"}, child, "text")
  function h(tag, attrs, ...children) {
    const el = document.createElement(tag);
    for (const [key, value] of Object.entries(attrs || {})) {
      if (value === false || value == null) continue;
      if (key.startsWith("on")) el.addEventListener(key.slice(2), value);
      else el.setAttribute(key, value === true ? "" : value);
    }
    for (const child of children.flat()) {
      if (child == null || child === false) continue;
      el.append(child instanceof Node ? child : document.createTextNode(child));
    }
    return el;
  }

  function tier(value) {
    if (value >= 95) return "s";
    if (value >= 90) return "elite";
    if (value >= 75) return "great";
    if (value >= 60) return "good";
    if (value >= 45) return "ok";
    return "low";
  }

  // Attribute value -> letter grade
  const LETTERS = [
    [95, "S"],
    [80, "A"],
    [65, "B"],
    [50, "C"],
    [40, "D"],
    [0, "F"]
  ];

  function letter(value) {
    return LETTERS.find(([min]) => value >= min)[1];
  }

  // YouTube search for a player's highlights. Some names are
  // searched under a different spelling.
  const SEARCH_NAMES = {
    "w0nderful": "wonderful"
  };

  function highlightsUrl(name) {
    const query = `${SEARCH_NAMES[name] || name} cs2 highlights`;
    return "https://www.youtube.com/results?" +
      new URLSearchParams({ search_query: query });
  }

  function average(values) {
    return values.reduce((a, b) => a + b, 0) / values.length;
  }

  function playerOverall(player) {
    return average(ATTRS.map(a => player.stats[a]));
  }

  function readBest() {
    try { return Number(localStorage.getItem(BEST_KEY)) || null; }
    catch (e) { return null; }
  }

  function readSoundOn() {
    try { return localStorage.getItem(SOUND_KEY) !== "off"; }
    catch (e) { return true; }
  }

  let soundOn = readSoundOn();

  function renderSoundButton() {
    $("sound").textContent = soundOn ? "Sound on" : "Sound off";
    $("sound").setAttribute("aria-pressed", String(soundOn));
  }

  function toggleSound() {
    soundOn = !soundOn;
    try { localStorage.setItem(SOUND_KEY, soundOn ? "on" : "off"); }
    catch (e) { /* storage unavailable */ }
    if (!soundOn) stopSpinSound();
    renderSoundButton();
  }

  // Returns true when the sound was started
  function playSpinSound() {
    if (!soundOn) return false;
    spinSound.currentTime = 0;
    spinSound.play().catch(() => { /* blocked or unavailable */ });
    return true;
  }

  function stopSpinSound() {
    spinSound.pause();
    spinSound.currentTime = 0;
  }

  function saveBest(value) {
    try { localStorage.setItem(BEST_KEY, String(value)); }
    catch (e) { /* storage unavailable */ }
  }


  // ==========================================================
  // GAME STATE
  // ==========================================================

  function newGame() {
    state = {
      taken: {},            // attribute -> { value, player, team }
      usedTeams: new Set(), // a team is only rolled once per game
      team: null,
      selected: null,
      respins: RESPINS,
      phase: "spin",        // spin | spinning | pick | done
      justLanded: false,
      submitted: false,
      bestBefore: readBest()
    };
    render();
  }

  function availableAttributes() {
    return ATTRS.filter(a => !(a in state.taken));
  }

  function randomTeam() {
    let pool = DATA.teams.filter(t => !state.usedTeams.has(t.name));
    if (pool.length === 0) pool = DATA.teams;
    return pool[Math.floor(Math.random() * pool.length)];
  }


  // ==========================================================
  // ACTIONS
  // ==========================================================

  function spin(isRespin) {

    if (isRespin) {
      if (state.phase !== "pick" || state.respins === 0 || state.selected != null) return;
      state.respins -= 1;
    } else if (state.phase !== "spin") {
      return;
    }

    const team = randomTeam();
    state.usedTeams.add(team.name);
    state.team = null;
    state.selected = null;
    state.phase = "spinning";
    render();

    let landed = false;
    const game = state;
    let placeReel = () => {};

    const land = () => {
      // Ignore a spin that finishes after the game was restarted
      if (landed || state !== game) return;
      landed = true;
      placeReel(Infinity);
      // Leave the stopped reel in place, teams above and below
      $("reel-strip").dataset.landed = team.name;
      state.team = team;
      state.phase = "pick";
      state.justLanded = true;
      render();
    };

    if (reduceMotion) return land();

    const timing = SPIN_TIMING;
    const stopAt = timing.ticks.length;
    const end = timing.ticks[stopAt - 1];

    // Fill the reel with teams in a random order so the rolled
    // team lands on the last tick, with a few more after it.
    // Teams only repeat if there are more ticks than teams.
    const others = DATA.teams.map(t => t.name).filter(name => name !== team.name);
    let pool = [];
    while (pool.length < stopAt - 1 + REEL_AFTER) pool = pool.concat(shuffle(others));
    const before = pool.slice(0, stopAt - 1);
    const after = pool.slice(stopAt - 1, stopAt - 1 + REEL_AFTER);

    const names = [$("reel-strip").textContent || "?", ...before, team.name, ...after];

    const strip = $("reel-strip");
    strip.replaceChildren(...names.map(name => h("div", { class: "reel-item" }, name)));
    strip.style.transition = "none";

    const item = strip.firstChild.offsetHeight;
    const centre = ($("reel").clientHeight - item) / 2;

    placeReel = t => {
      strip.style.transform =
        `translateY(${centre - reelPosition(t, timing) * item}px)`;
    };
    placeReel(0);

    // The reel clock starts when the sound actually starts
    // playing, so the ticks line up even if audio is slow to begin
    let startedAt = null;

    const frame = now => {
      if (landed || state !== game) return;
      const t = (now - startedAt) / 1000;
      if (t >= end) return land();
      placeReel(t);
      requestAnimationFrame(frame);
    };

    const startClock = () => {
      if (startedAt != null || state !== game) return;
      startedAt = performance.now();
      requestAnimationFrame(frame);
      // Lands even if animation frames stop (e.g. a hidden tab)
      setTimeout(land, end * 1000 + 500);
    };

    if (playSpinSound()) {
      spinSound.addEventListener("playing", startClock, { once: true });
      setTimeout(startClock, 400); // the sound may be blocked
    } else {
      startClock();
    }
  }

  function shuffle(items) {
    const copy = [...items];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function setReel(text) {
    const strip = $("reel-strip");
    delete strip.dataset.landed;
    strip.style.transition = "none";
    strip.style.transform = "";
    strip.replaceChildren(h("div", { class: "reel-item" }, text));
  }

  // Picking a player locks it in until an attribute is taken
  function selectPlayer(index) {
    if (state.phase !== "pick" || state.selected != null) return;
    state.selected = index;
    render();
  }

  function takeAttribute(attr) {
    if (state.phase !== "pick" || state.selected == null) return;
    if (attr in state.taken) return;

    const player = state.team.players[state.selected];

    state.taken[attr] = {
      value: player.stats[attr],
      raw: player.raw[attr],
      player: player.name,
      team: state.team.name
    };

    state.team = null;
    state.selected = null;
    state.phase = Object.keys(state.taken).length === ROUNDS ? "done" : "spin";

    if (state.phase === "done") {
      const overall = Math.round(buildOverall());
      if (state.bestBefore == null || overall > state.bestBefore) saveBest(overall);
    }

    render();
  }

  function buildOverall() {
    const values = Object.values(state.taken).map(t => t.value);
    return values.length ? average(values) : null;
  }


  // ==========================================================
  // RENDER
  // ==========================================================

  function render() {
    renderBuild();
    renderPlay();
    renderResult();
  }

  function renderBuild() {

    $("slots").replaceChildren(...ATTRS.map(attr => {
      const t = state.taken[attr];
      if (!t) {
        return h("li", { class: "slot empty" },
          h("div", { class: "slot-top" },
            h("span", { class: "slot-name" }, attr),
            h("span", { class: "slot-value", style: "color: var(--muted)" }, "–")
          ),
          h("div", { class: "slot-source" }, "Available")
        );
      }
      const tr = tier(t.value);
      return h("li", { class: "slot" },
        h("div", { class: "slot-top" },
          h("span", { class: "slot-name" }, attr),
          h("span", { class: "slot-value t-" + tr, title: `${Math.round(t.value)} (raw ${t.raw})` }, letter(t.value))
        ),
        h("div", { class: "slot-source" }, `${t.player} · ${t.team}`),
        h("div", { class: "bar" },
          h("span", { class: "b-" + tr, style: `width: ${Math.min(t.value, 100)}%` })
        )
      );
    }));

    const available = availableAttributes();
    $("available").replaceChildren(
      available.length
        ? h("span", {}, "Available attributes: ", h("b", {}, available.join(", ")))
        : "All attributes taken."
    );
  }

  function renderPlay() {

    const done = state.phase === "done";
    $("play").hidden = done;
    if (done) return;

    const round = Object.keys(state.taken).length + 1;
    $("round").textContent = round;
    $("respins-left").textContent =
      `${state.respins} respin${state.respins === 1 ? "" : "s"} left`;

    const spinning = state.phase === "spinning";
    $("reel").classList.toggle("spinning", spinning);

    const display = document.querySelector(".team-display");
    display.classList.remove("landed");

    if (state.team) {
      // Keep the stopped reel showing; rebuild it only if it
      // isn't already stopped on this team
      if ($("reel-strip").dataset.landed !== state.team.name) setReel(state.team.name);
      if (state.justLanded) {
        display.offsetWidth; // restart the animation
        display.classList.add("landed");
      }
      const bits = [`${state.team.players.length} players`];
      if (DEBUG) {
        bits.push(state.team.cluster == null ? "no cluster" : `cluster ${state.team.cluster}`);
        bits.push(`schedule ×${state.team.multiplier.toFixed(2)}`);
      }
      $("team-meta").textContent = bits.join(" · ");
    } else if (!spinning) {
      setReel(round === 1 ? "Ready?" : "Next team");
      $("team-meta").textContent = "";
    } else {
      $("team-meta").textContent = "";
    }

    $("spin").disabled = state.phase !== "spin";
    $("respin").disabled =
      state.phase !== "pick" || state.respins === 0 || state.selected != null;
    $("respin").textContent = state.respins ? "Respin team" : "No respins left";

    $("hint").textContent =
      state.phase === "spin" ? "Spin to roll a random team." :
      spinning ? "Rolling…" :
      state.selected == null
        ? "Pick a player carefully: once you click one, you're locked in."
        : `Locked in on ${state.team.players[state.selected].name}. Take one of their available attributes.`;

    renderRoster();
  }

  function renderRoster() {

    const roster = $("roster");

    if (!state.team) {
      roster.replaceChildren();
      return;
    }

    const available = availableAttributes();

    const locked = state.selected != null;
    roster.classList.toggle("locked", locked);

    // Deal the cards in only when a new team lands, not on every click
    roster.classList.toggle("enter", state.justLanded);
    state.justLanded = false;

    roster.replaceChildren(...state.team.players.map((player, index) => {

      const selected = state.selected === index;

      const stats = ATTRS.map(attr => {
        const value = player.stats[attr];
        return h("div", {
          class: "mini" + (attr in state.taken ? " taken" : ""),
          title: `${attr}: ${Math.round(value)} (raw ${player.raw[attr]})`
        },
          h("b", { class: "t-" + tier(value) }, letter(value)),
          attr.slice(0, 3)
        );
      });

      const picker = selected && h("div", { class: "pick" },
        h("div", { class: "pick-label" }, "Locked in. Take an attribute:"),
        available.map(attr => h("button", {
          class: "pick-btn",
          onclick: () => takeAttribute(attr)
        },
          h("span", {}, attr),
          h("b", { class: "t-" + tier(player.stats[attr]) }, letter(player.stats[attr]))
        ))
      );

      // Clicking anywhere on a card locks that player in
      return h("div", {
        class: "player" + (selected ? " selected" : ""),
        style: `--i: ${index}`,
        onclick: () => selectPlayer(index)
      },
        h("button", {
          class: "player-head",
          "aria-expanded": selected ? "true" : "false",
          disabled: locked && !selected
        },
          h("span", { class: "player-name" }, player.name),
          player.age != null && h("span", { class: "player-age" }, `${player.age} yrs`)
        ),
        h("div", { class: "player-stats" }, stats),
        picker
      );
    }));
  }

  // Cutoffs from simulated games where each round takes the
  // highest value on offer: median 85.5, top 5% above 91
  function buildGrade(overall) {
    return overall >= 91 ? "S" :
      overall >= 88.5 ? "A" :
      overall >= 85.5 ? "B" :
      overall >= 82 ? "C" : "D";
  }

  function renderResult() {

    const done = state.phase === "done";
    $("result").hidden = !done;
    if (!done) return;

    const overall = buildOverall();
    const rounded = Math.round(overall);

    const grade = buildGrade(overall);

    const beaten = ALL_PLAYERS.filter(p => playerOverall(p) < overall).length;
    const percent = Math.round(100 * beaten / ALL_PLAYERS.length);

    // Closest real player by attribute profile
    let closest = null;
    let closestDistance = Infinity;
    for (const player of ALL_PLAYERS) {
      const distance = Math.hypot(
        ...ATTRS.map(a => player.stats[a] - state.taken[a].value)
      );
      if (distance < closestDistance) {
        closest = player;
        closestDistance = distance;
      }
    }

    const best = readBest();
    const newBest = state.bestBefore == null || rounded > state.bestBefore;

    $("grade").textContent = grade;
    $("grade").className = "grade t-" + tier(overall);
    $("result-overall").textContent = `${rounded} overall`;

    $("result-lines").replaceChildren(
      h("p", {}, "Better than ", h("b", {}, `${percent}%`), " of real players."),
      h("p", {},
        "Plays most like ",
        h("a", {
          class: "player-link",
          href: highlightsUrl(closest.name),
          target: "_blank",
          rel: "noopener",
          title: `Watch ${closest.name} highlights on YouTube`
        }, closest.name),
        ` (${closest.team}).`
      ),
      h("p", {},
        newBest
          ? h("b", {}, "New personal best!")
          : ["Personal best: ", h("b", {}, String(best))]
      )
    );

    renderSubmit();
  }


  // ==========================================================
  // LEADERBOARD
  // ==========================================================
  //
  // Scores are stored in Supabase through its REST API. The
  // connection settings live in leaderboard-config.js; without
  // them the leaderboard stays hidden.

  const LB = window.LEADERBOARD || {};
  const LB_ON = Boolean(LB.url && LB.key);
  const LB_SIZE = 10;
  const NAME_KEY = "cs2-player-builder-name";

  let myScoreId = null;

  async function lbFetch(path, options = {}) {
    const headers = { apikey: LB.key, "Content-Type": "application/json" };
    // Legacy anon keys are JWTs and also go in Authorization
    if (LB.key.startsWith("eyJ")) headers.Authorization = `Bearer ${LB.key}`;

    const response = await fetch(`${LB.url.replace(/\/$/, "")}/rest/v1/${path}`, {
      ...options,
      headers: { ...headers, ...(options.headers || {}) }
    });

    if (!response.ok) {
      throw new Error(`${response.status} ${await response.text()}`);
    }
    return response;
  }

  // Number of rows matching a filter, from the Content-Range header
  async function lbCount(filter) {
    const response = await lbFetch(`scores?select=id${filter}`, {
      method: "HEAD",
      headers: { Prefer: "count=exact" }
    });
    const range = response.headers.get("content-range") || "*/0";
    return Number(range.split("/")[1]) || 0;
  }

  let boardLoading = false;
  let boardLoadedAt = 0;

  async function loadBoard() {
    if (!LB_ON || boardLoading) return;

    $("board").hidden = false;
    boardLoading = true;
    boardLoadedAt = Date.now();

    try {
      const response = await lbFetch(
        `scores?select=id,name,score,grade&order=score.desc,created_at.asc&limit=${LB_SIZE}`
      );
      renderBoard(await response.json());
    } catch (e) {
      renderBoard([], "Couldn't load the leaderboard. Check your connection and refresh.");
    } finally {
      boardLoading = false;
    }
  }

  // Refresh every 30 seconds while the tab is visible. When the
  // tab comes back into view after a while, refresh straight away.
  const BOARD_REFRESH_MS = 30000;

  function startBoardRefresh() {
    if (!LB_ON) return;

    setInterval(() => {
      if (document.visibilityState === "visible") loadBoard();
    }, BOARD_REFRESH_MS);

    document.addEventListener("visibilitychange", () => {
      if (
        document.visibilityState === "visible" &&
        Date.now() - boardLoadedAt >= BOARD_REFRESH_MS
      ) {
        loadBoard();
      }
    });
  }

  function renderBoard(rows, message) {
    $("board-list").replaceChildren(...rows.map((row, i) =>
      h("li", { class: "board-row" + (row.id === myScoreId ? " mine" : "") },
        h("span", { class: "board-rank" }, `#${i + 1}`),
        h("span", { class: "board-name", title: row.name }, row.name),
        // Purple-tier scores (95+) show as SS on the leaderboard only
        h("span", { class: "board-grade t-" + tier(Number(row.score)) },
          tier(Number(row.score)) === "s" ? "SS" : row.grade),
        h("span", { class: "board-score" }, Number(row.score).toFixed(1))
      )
    ));

    const empty = message || (rows.length ? "" : "No scores yet. Finish a game to set the first one.");
    $("board-empty").textContent = empty;
    $("board-empty").hidden = !empty;
  }

  function readName() {
    try { return localStorage.getItem(NAME_KEY) || ""; }
    catch (e) { return ""; }
  }

  function saveName(name) {
    try { localStorage.setItem(NAME_KEY, name); }
    catch (e) { /* storage unavailable */ }
  }

  function setSubmitStatus(text, isError) {
    $("submit-status").textContent = text;
    $("submit-status").classList.toggle("error", Boolean(isError));
    $("submit-status").hidden = !text;
  }

  function renderSubmit() {
    if (!LB_ON) return;

    $("submit").hidden = state.submitted;
    if (!state.submitted) {
      if (!$("player-name").value) $("player-name").value = readName();
      $("submit-btn").disabled = false;
      $("submit-btn").textContent = "Submit score";
      setSubmitStatus("");
    }
  }

  async function submitScore(event) {
    event.preventDefault();
    if (!LB_ON || state.phase !== "done" || state.submitted) return;

    const name = $("player-name").value.trim().slice(0, 20);
    if (!name) {
      setSubmitStatus("Enter a name to submit your score.", true);
      return;
    }

    const overall = Math.round(buildOverall() * 10) / 10;

    const build = {};
    for (const attr of ATTRS) {
      const t = state.taken[attr];
      build[attr] = { player: t.player, team: t.team, value: t.value };
    }

    $("submit-btn").disabled = true;
    $("submit-btn").textContent = "Submitting…";

    try {
      const response = await lbFetch("scores", {
        method: "POST",
        headers: { Prefer: "return=representation" },
        body: JSON.stringify({ name, score: overall, grade: buildGrade(overall), build })
      });

      const [row] = await response.json();
      myScoreId = row.id;
      state.submitted = true;
      saveName(name);

      const [higher, total] = await Promise.all([
        lbCount(`&score=gt.${overall}`),
        lbCount("")
      ]);

      $("submit").hidden = true;
      setSubmitStatus(`Saved. You placed #${higher + 1} of ${total}.`);
      loadBoard();
    } catch (e) {
      $("submit-btn").disabled = false;
      $("submit-btn").textContent = "Submit score";
      setSubmitStatus("Couldn't save your score. Try again.", true);
    }
  }


  // ==========================================================
  // RESTART
  // ==========================================================
  //
  // Mid-game, the first click asks for confirmation and the
  // second click restarts.

  let restartTimer = null;

  function resetRestartButton() {
    clearTimeout(restartTimer);
    restartTimer = null;
    $("restart").classList.remove("confirm");
    $("restart").textContent = "Restart";
  }

  function restart() {
    const inProgress =
      Object.keys(state.taken).length > 0 || state.phase !== "spin";

    if (inProgress && !restartTimer) {
      $("restart").classList.add("confirm");
      $("restart").textContent = "Click again to restart";
      restartTimer = setTimeout(resetRestartButton, 3000);
      return;
    }

    resetRestartButton();
    stopSpinSound();
    newGame();
  }


  // ==========================================================
  // COPY RESULT
  // ==========================================================

  function resultText() {
    const lines = ATTRS.map(a => {
      const t = state.taken[a];
      return `${a}: ${letter(t.value)} (${t.player}, ${t.team})`;
    });
    return [
      `CS2 Player Builder: ${Math.round(buildOverall())} overall`,
      ...lines
    ].join("\n");
  }

  async function copyResult() {
    const button = $("copy");
    try {
      await navigator.clipboard.writeText(resultText());
      button.textContent = "Copied!";
    } catch (e) {
      button.textContent = "Copy failed";
    }
    setTimeout(() => { button.textContent = "Copy result"; }, 1500);
  }


  // ==========================================================
  // START
  // ==========================================================

  $("spin").addEventListener("click", () => spin(false));
  $("respin").addEventListener("click", () => spin(true));
  $("again").addEventListener("click", newGame);
  $("restart").addEventListener("click", restart);
  $("sound").addEventListener("click", toggleSound);
  renderSoundButton();
  $("copy").addEventListener("click", copyResult);
  $("submit").addEventListener("submit", submitScore);

  $("footer").hidden = !DEBUG;
  $("available").hidden = !DEBUG;

  $("footer").textContent =
    `${DATA.teams.length} teams, ${ALL_PLAYERS.length} players. ` +
    `Attributes are adjusted for strength of schedule. ` +
    `Sniping is ranked among AWPers only; riflers have none. Data from ${DATA.generated}.`;

  newGame();
  loadBoard();
  startBoardRefresh();

})();
</script>
</body>
</html>
